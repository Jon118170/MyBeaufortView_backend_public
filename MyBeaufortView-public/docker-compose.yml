services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mybeaufortview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/mybeaufortview
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: changeme
      JWT_SECRET: ${JWT_SECRET}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-mybeaufortview-dev}
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_S3_ENABLED: "false"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
