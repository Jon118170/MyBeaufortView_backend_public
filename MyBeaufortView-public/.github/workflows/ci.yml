name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # prevents shallow fetch 404 noise

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run unit tests (excluding PostgresFlywaySmokeTest)
        run: ./mvnw -B test -Dtest='!PostgresFlywaySmokeTest'

  postgres-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # prevents shallow fetch 404 noise

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Docker sanity check
        run: docker info

      - name: Run PostgresFlywaySmokeTest (Testcontainers)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: ./mvnw -B test -Dtest=PostgresFlywaySmokeTest
