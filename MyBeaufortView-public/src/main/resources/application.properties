spring.application.name=mybeaufortview_backend

# DataSource (en-var only)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.show.open-in-view=false

# JWT Secret
# Must be at least 256-bit Base64
app.jwt.secret-key=${JWT_SECRET}

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.firewall=INFO
logging.level.org.hibernate.SQL=INFO

# AWS CONNECT and S3 BUCKET
app.aws.s3.bucket-name=${AWS_S3_BUCKET}
app.aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.enabled=${AWS_S3_ENABLED:false}

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# OpenAPI configuration
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# OpenAI Configuration
app.openai.api-key=${OPENAI_API_KEY}
app.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
app.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

## Actuator configuration

# Actuator base path
management.endpoints.web.base-path=/actuator

# Expose only what we actually want
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Do NOT leak internals
management.endpoint.health.show-details=never

# Enable health probes for Kubernetes
management.health.probes.enabled=true

# Explicitly enable info endpoint
management.endpoint.info.enabled=true

# Enable info endpoint by default
management.info.defaults.enabled=true

# Micrometer global tags (low-cardinality)
management.metrics.tags.application=mybeaufortview_backend

# Actuator info endpoint metadata
info.app.name=${spring.application.name}
info.app.version=0.1.0
