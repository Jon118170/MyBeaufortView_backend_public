# --------
# Test Security Configuration
# --------

# Use a simple password encoder for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Logging levels for debugging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.firewall=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Base64-encoded 256-bit secret (HS256)
app.jwt.secret-key=ZHVtbXktdGVzdC1zZWNyZXQta2V5LTI1Ni1iaXRzLXN1ZmZpY2llbnQ=

# Disable noisy SQL logs
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Database Configuration for Tests
aws.s3.bucket=test-bucket
aws.s3.region=us-east-1
aws.s3.enabled=true

# OpenAPI configuration for tests
app.openai.api-key=test-key
app.openai.model=gpt-4.1-mini
app.openai.base-url=https://api.openai.com/v1

# Flyway OFF for tests
spring.flyway.enabled=false
